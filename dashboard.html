<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Orçamento do Casal</title>
<style>
:root {
  --bg: #0b0f1a;
  --bg2: #141a2b;
  --bg3: #1e2740;
  --border: #2a3454;
  --text: #e6eaf5;
  --muted: #8a93b0;
  --accent: #60a5fa;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --purple: #a78bfa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
header {
  background: var(--bg2);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { font-size: 16px; font-weight: 700; color: var(--accent); flex: 1; }
header select, header button {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}
header select:hover, header button:hover { border-color: var(--accent); }
nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  overflow-x: auto;
  scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
nav button {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 12px 14px;
  white-space: nowrap;
  cursor: pointer;
  font-size: 13px;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
nav button:hover { color: var(--text); }
nav button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
main { padding: 16px; max-width: 1400px; margin: 0 auto; padding-bottom: 80px; }
h2 { font-size: 20px; margin-bottom: 16px; }
h3 { font-size: 16px; margin: 16px 0 8px; color: var(--muted); font-weight: 600; }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
}
.card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.card .value { font-size: 22px; font-weight: 700; margin-top: 4px; }
.card .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.card.good .value { color: var(--good); }
.card.bad .value { color: var(--bad); }
.card.warn .value { color: var(--warn); }

.section { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--bg3); color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
tr:hover td { background: rgba(255,255,255,0.02); }
.matrix tr.subtotal-row:hover td, .matrix tr.total-row:hover td, .matrix tr.group-header:hover td { background: unset; }
.matrix tr.subtotal-row:hover td { background: #1a2540; }
.matrix tr.subtotal-row:hover td.tcol { background: #243a60; }
.matrix tr.total-row:hover td { background: #253252; }
.matrix tr.total-row:hover td.tcol { background: #34466e; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input, td select {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 13px;
  width: 100%;
}
td input:hover, td select:hover { border-color: var(--border); }
td input:focus, td select:focus { border-color: var(--accent); outline: none; background: var(--bg3); }
td input[type=number], td input.num { text-align: right; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge.mensal { background: rgba(96,165,250,0.15); color: var(--accent); }
.badge.anual { background: rgba(167,139,250,0.15); color: var(--purple); }
.badge.data { background: rgba(251,191,36,0.15); color: var(--warn); }
.badge.semanal { background: rgba(52,211,153,0.15); color: var(--good); }
.badge.ok { background: rgba(52,211,153,0.15); color: var(--good); }
.badge.alerta { background: rgba(251,191,36,0.15); color: var(--warn); }
.badge.estouro { background: rgba(248,113,113,0.15); color: var(--bad); }

.btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover { opacity: 0.9; }
.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn.danger { background: var(--bad); }
.btn-small { padding: 4px 10px; font-size: 12px; }

.form-row { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
.form-row label { color: var(--muted); font-size: 13px; }
.form-row input, .form-row select, .form-row textarea {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 14px;
  width: 100%;
  font-family: inherit;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); outline: none; }

.gavetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
.gaveta {
  background: var(--bg2);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}
.gaveta:hover, .gaveta.active { border-color: var(--accent); background: var(--bg3); }
.gaveta h3 { color: var(--text); margin: 0 0 4px; }
.gaveta .sub { color: var(--muted); font-size: 12px; }

.bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; margin-top: 4px; }
.bar-fill { height: 100%; background: var(--good); transition: width 0.3s; }
.bar-fill.warn { background: var(--warn); }
.bar-fill.bad { background: var(--bad); }

.alert {
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 8px;
  border-left: 3px solid var(--warn);
  background: rgba(251,191,36,0.08);
}
.alert.bad { border-left-color: var(--bad); background: rgba(248,113,113,0.08); }
.alert.ok { border-left-color: var(--good); background: rgba(52,211,153,0.08); }

.muted { color: var(--muted); }
.num-good { color: var(--good); font-variant-numeric: tabular-nums; }
.num-bad { color: var(--bad); font-variant-numeric: tabular-nums; }

footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 8px 16px;
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  font-size: 12px;
}

@media (max-width: 640px) {
  main { padding: 12px; }
  .form-row { grid-template-columns: 1fr; gap: 4px; }
  .form-row label { font-size: 11px; }
  table { font-size: 12px; }
  th, td { padding: 6px 8px; }
}

/* Sub-tabs dentro de uma view */
.subtabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.subtab {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 10px 18px;
  cursor: pointer;
  font-size: 14px;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: inherit;
  transition: color 0.15s;
}
.subtab:hover { color: var(--text); }
.subtab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ===== Matriz horizontal (Orçamento) ===== */
.matrix-wrap {
  overflow: auto;
  max-height: 75vh;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg2);
  scrollbar-gutter: stable;
}
.matrix-wrap::-webkit-scrollbar {
  height: 12px;
  width: 12px;
}
.matrix-wrap::-webkit-scrollbar-track {
  background: var(--bg);
}
.matrix-wrap::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 6px;
  border: 2px solid var(--bg);
}
.matrix-wrap::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}
.matrix-wrap::-webkit-scrollbar-corner {
  background: var(--bg);
}
.matrix { font-size: 12px; border-collapse: separate; border-spacing: 0; }
.matrix th, .matrix td { padding: 6px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
.matrix thead th {
  position: sticky; top: 0;
  background: var(--bg3);
  z-index: 3;
  font-weight: 600;
  font-size: 11px;
}
.matrix td.sticky-col, .matrix th.sticky-col {
  position: sticky; left: 0;
  background: var(--bg2);
  z-index: 2;
  border-right: 2px solid var(--border);
  min-width: 220px;
  max-width: 260px;
}
.matrix thead th.sticky-col { background: var(--bg3); z-index: 4; }
.matrix .group-header td {
  background: var(--bg3);
  font-weight: 700;
  color: var(--accent);
  padding: 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Totais travados à direita (opacos pra não vazar texto de trás) */
.matrix td.tcol, .matrix th.tcol {
  background: #1e2740;
  font-weight: 700;
  min-width: 110px;
  max-width: 110px;
  position: sticky;
  z-index: 2;
  font-variant-numeric: tabular-nums;
}
.matrix td.tcol-1, .matrix th.tcol-1 { right: 220px; border-left: 2px solid var(--border); }
.matrix td.tcol-2, .matrix th.tcol-2 { right: 110px; }
.matrix td.tcol-3, .matrix th.tcol-3 { right: 0; color: var(--accent); }
.matrix thead th.tcol { z-index: 4; background: #2a3454; }

/* Linha de subtotal — azul médio */
.matrix .subtotal-row td {
  background: #1a2540;
  color: var(--text);
  font-weight: 600;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.matrix .subtotal-row td.tcol { background: #243a60; }
.matrix .subtotal-row td.sticky-col {
  background: #1a2540;
  color: var(--accent);
  font-weight: 700;
}
.matrix .subtotal-row td.tcol-3 { color: var(--accent); }

/* Linha total geral — destaque mais forte */
.matrix .total-row td {
  background: #253252;
  color: var(--text);
  font-weight: 700;
  font-size: 13px;
  border-top: 2px solid var(--accent);
}
.matrix .total-row td.tcol { background: #34466e; }
.matrix .total-row td.sticky-col {
  background: #253252;
  color: var(--accent);
  font-size: 13px;
}
.matrix .total-row td.tcol-3 { color: var(--good); font-size: 14px; }
.matrix a.cat-link {
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  display: inline-block;
}
.matrix a.cat-link:hover { color: var(--accent); }
.matrix .zero { color: var(--muted); opacity: 0.4; }
.matrix input.cell-edit {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  padding: 2px 4px;
  width: 80px;
  text-align: right;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  border-radius: 3px;
}
.matrix input.cell-edit:hover { border-color: var(--border); }
.matrix input.cell-edit:focus { border-color: var(--accent); background: var(--bg3); outline: none; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 16px;
}
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 12px;
  max-width: 700px;
  width: 100%;
  max-height: 90vh;
  display: flex; flex-direction: column;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h3 { color: var(--accent); margin: 0; }
.modal-header button {
  background: transparent; border: none; color: var(--muted);
  font-size: 20px; cursor: pointer; line-height: 1;
}
.modal-header button:hover { color: var(--bad); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}
.modal-body table { font-size: 12px; }
.modal-body h4 { margin: 16px 0 8px; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
.tipo-info strong { color: var(--accent); }
.tipo-info .ex { color: var(--muted); font-style: italic; margin-top: 8px; display: block; font-size: 11px; }
.tipo-regras { margin: 8px 0; padding: 8px 0; border-top: 1px solid var(--border); }
.tipo-regras .regra { margin: 4px 0; font-size: 12px; }
.regra-label { font-weight: 700; display: inline-block; min-width: 88px; }
.regra-estourou { color: var(--bad); }
.regra-faltou { color: var(--good); }

/* Chips de tipo */
.tipo-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-tipo {
  position: relative;
  padding: 7px 12px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  user-select: none;
  transition: all 0.15s;
}
.chip-tipo:hover { border-color: var(--accent); }
.chip-tipo.active {
  background: rgba(96,165,250,0.2);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}
.chip-tipo .chip-tooltip {
  position: fixed;
  width: 340px;
  background: var(--bg);
  border: 1px solid var(--accent);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text);
  text-align: left;
  display: none;
  z-index: 9999;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  white-space: normal;
  font-weight: 400;
  pointer-events: none;
}
.chip-tipo .chip-tooltip strong { color: var(--accent); }
.chip-tipo .chip-tooltip .ex { color: var(--muted); font-style: italic; margin-top: 8px; display: block; font-size: 11px; }
@media (max-width: 640px) {
  .chip-tipo .chip-tooltip { width: 260px; }
}

/* Drag handle e estados de arrastar do PL */
tr.pl-row { cursor: default; }
tr.pl-row .pl-handle {
  cursor: grab;
  color: var(--muted);
  user-select: none;
  text-align: center;
  font-size: 14px;
  width: 24px;
  padding: 4px;
}
tr.pl-row:hover .pl-handle { color: var(--accent); }
tr.pl-row.pl-dragging { opacity: 0.35; }
tr.pl-row.pl-dragging .pl-handle { cursor: grabbing; }
tr.pl-drop-before > td { box-shadow: inset 0 2px 0 0 var(--accent); }
tr.pl-drop-end > td { box-shadow: inset 0 -2px 0 0 var(--accent); }
tr.pl-empty-row.pl-drop-end > td { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 4px; }

/* Linha de subtotal nas tabelas do PL */
tr.pl-subtotal-row td {
  background: #1a2540;
  color: var(--accent);
  font-weight: 700;
  border-top: 1px solid var(--border);
  border-bottom: none;
  padding: 8px 10px;
  font-variant-numeric: tabular-nums;
}
tr.pl-subtotal-row:hover td { background: #1a2540; }

/* Cabeçalho de grupo no Dashboard — mostra totais por grupo */
tr.dash-grupo-header { background: var(--bg3); cursor: pointer; }
tr.dash-grupo-header td {
  font-weight: 700;
  color: var(--accent);
  padding: 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
tr.dash-grupo-header:hover td { background: #243a60; }

/* Linha de Total no rodapé das tabelas de Histórico */
tr.hist-total-row td {
  background: #253252;
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
  border-top: 2px solid var(--accent);
  border-bottom: none;
  padding: 10px;
}
tr.hist-total-row td.num { color: var(--good); font-variant-numeric: tabular-nums; }
tr.hist-total-row:hover td { background: #253252; }
</style>
</head>
<body>

<header>
  <h1>💰 Orçamento do Casal</h1>
  <select id="selMes"></select>
</header>

<nav id="nav"></nav>
<main id="app"></main>
<div id="modal-container"></div>

<footer>
  <span class="muted" id="statusBar">Pronto</span>
  <button class="btn btn-small ghost" onclick="app.resetarTudo()">🔄 Resetar tudo</button>
</footer>

<script>
// ==========================================================
// 1. DADOS PRÉ-POPULADOS (SEED)
// ==========================================================

const SEMANAS_MES = [
  {chave_mes:'2026-05', ano:2026, mes:5, mes_nome:'mai-26', dias_uteis:20, semanas:5},
  {chave_mes:'2026-06', ano:2026, mes:6, mes_nome:'jun-26', dias_uteis:22, semanas:4},
  {chave_mes:'2026-07', ano:2026, mes:7, mes_nome:'jul-26', dias_uteis:23, semanas:4},
  {chave_mes:'2026-08', ano:2026, mes:8, mes_nome:'ago-26', dias_uteis:21, semanas:5},
  {chave_mes:'2026-09', ano:2026, mes:9, mes_nome:'set-26', dias_uteis:21, semanas:4},
  {chave_mes:'2026-10', ano:2026, mes:10, mes_nome:'out-26', dias_uteis:21, semanas:5},
  {chave_mes:'2026-11', ano:2026, mes:11, mes_nome:'nov-26', dias_uteis:19, semanas:5},
  {chave_mes:'2026-12', ano:2026, mes:12, mes_nome:'dez-26', dias_uteis:22, semanas:4},
  {chave_mes:'2027-01', ano:2027, mes:1, mes_nome:'jan-27', dias_uteis:21, semanas:5},
  {chave_mes:'2027-02', ano:2027, mes:2, mes_nome:'fev-27', dias_uteis:19, semanas:4},
  {chave_mes:'2027-03', ano:2027, mes:3, mes_nome:'mar-27', dias_uteis:22, semanas:4},
  {chave_mes:'2027-04', ano:2027, mes:4, mes_nome:'abr-27', dias_uteis:20, semanas:4},
  {chave_mes:'2027-05', ano:2027, mes:5, mes_nome:'mai-27', dias_uteis:20, semanas:5},
  {chave_mes:'2027-06', ano:2027, mes:6, mes_nome:'jun-27', dias_uteis:22, semanas:4},
  {chave_mes:'2027-07', ano:2027, mes:7, mes_nome:'jul-27', dias_uteis:23, semanas:5},
  {chave_mes:'2027-08', ano:2027, mes:8, mes_nome:'ago-27', dias_uteis:21, semanas:5},
  {chave_mes:'2027-09', ano:2027, mes:9, mes_nome:'set-27', dias_uteis:21, semanas:4},
  {chave_mes:'2027-10', ano:2027, mes:10, mes_nome:'out-27', dias_uteis:21, semanas:5},
  {chave_mes:'2027-11', ano:2027, mes:11, mes_nome:'nov-27', dias_uteis:19, semanas:4},
  {chave_mes:'2027-12', ano:2027, mes:12, mes_nome:'dez-27', dias_uteis:22, semanas:4},
];

// Helper: retorna todos os chave_mes entre start e end inclusive
function mesesEntre(start, end) {
  return SEMANAS_MES.filter(m => m.chave_mes >= start && m.chave_mes <= end).map(m => m.chave_mes);
}

function mesesAno(ano) {
  return SEMANAS_MES.filter(m => m.ano === ano).map(m => m.chave_mes);
}

// Filtro de visualização — retorna os meses a mostrar na matriz de orçamento
function getMesesVisiveis() {
  if (STATE?.ui?.filtrar_mes) {
    const ativo = STATE.config.mes_ativo;
    return SEMANAS_MES.filter(m => m.chave_mes >= ativo);
  }
  return SEMANAS_MES;
}

// ==========================================================
// BUDGET DE DESPESAS (SEED)
// ==========================================================
// tipo: mensal | anual_acrual | data_fixa | semanal
// Para data_fixa: usa ocorrencias [{chave_mes, valor}]
// Para anual_acrual: orcamento_anual {2026: X, 2027: Y}; ritmo mensal = anual / meses_do_ano_orcados
// Para semanal: valor_base = valor por semana
// Para mensal: valor_base = valor por mês

// Helper pra criar ocorrências repetidas
const _rep = (meses, valor) => meses.map(m => ({chave_mes: m, valor}));

let STATE = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      // merge simples se faltar algum campo novo
      const def = defaultState();
      const merged = {...def, ...s, config: {...def.config, ...s.config}, ui: {...def.ui, ...(s.ui||{})}};
      // Migrações
      if (merged.budget_receitas) merged.budget_receitas.forEach(r => {
        if (r.categoria === '13º' || r.categoria === '14º') r.categoria = '13º e 14º';
      });
      if (merged.lancamentos_receitas) merged.lancamentos_receitas.forEach(r => {
        if (r.categoria === '13º' || r.categoria === '14º') r.categoria = '13º e 14º';
      });
      // Garante Auxílio Natal da Manuella
      [['2026-12', 500], ['2027-12', 500]].forEach(([mes, val]) => {
        const jaTem = merged.budget_receitas.find(r => r.pessoa === 'Manuella' && r.categoria === 'Auxílio Natal' && r.chave_mes === mes);
        if (!jaTem) merged.budget_receitas.push({id:'rec_aux_manu_'+mes, pessoa:'Manuella', categoria:'Auxílio Natal', chave_mes:mes, valor_orcado:val});
      });
      // Remove Bônus de orçamento e de lançamentos realizados
      if (merged.budget_receitas) merged.budget_receitas = merged.budget_receitas.filter(r => r.categoria !== 'Bônus');
      if (merged.lancamentos_receitas) merged.lancamentos_receitas = merged.lancamentos_receitas.filter(r => r.categoria !== 'Bônus');
      // Remove categoria "Outros" (extras/lazer agora absorve estouros)
      if (merged.budget_despesas) {
        merged.budget_despesas = merged.budget_despesas.filter(d => d.id !== 'outros');
      }
      // Migra Mercado + Farmácia de "Fixa Felipe" para "Variável"
      if (merged.budget_despesas) {
        const mercado = merged.budget_despesas.find(d => d.id === 'mercado');
        if (mercado && mercado.grupo !== 'Variável') mercado.grupo = 'Variável';
      }
      // Atualiza defaults de Mercado (500/sem) e Whey (mensal 300) — one-time
      if (!merged.config?.migrated_mercado_whey_v2 && merged.budget_despesas) {
        const mercado = merged.budget_despesas.find(d => d.id === 'mercado');
        if (mercado) {
          mercado.valor_base = 500;
          mercado.tipo = 'semanal';
          if (!mercado.descricao || /\d+\/semana/.test(mercado.descricao)) mercado.descricao = '500/semana';
        }
        const whey = merged.budget_despesas.find(d => d.id === 'whey');
        if (whey) {
          whey.tipo = 'mensal';
          whey.valor_base = 300;
          delete whey.orcamento_anual;
          delete whey.ocorrencias;
          if (!whey.descricao || /300 cada/.test(whey.descricao)) whey.descricao = '300/mês';
        }
        merged.config = merged.config || {};
        merged.config.migrated_mercado_whey_v2 = true;
      }
      // Padroniza presentes (F→M, M→F) e restaurantes de aniv/dia dos namorados em R$ 500 — one-time
      if (!merged.config?.migrated_presentes_500 && merged.budget_despesas) {
        const ids500 = ['aniv_namoro_rest','aniv_namoro_fm','aniv_namoro_mf','dia_namorados_rest','dia_namorados_fm','dia_namorados_mf','natal_fm','natal_mf'];
        merged.budget_despesas.forEach(d => {
          if (ids500.includes(d.id)) {
            d.valor_base = 500;
            if (Array.isArray(d.ocorrencias)) d.ocorrencias.forEach(o => { o.valor = 500; });
          }
        });
        merged.config = merged.config || {};
        merged.config.migrated_presentes_500 = true;
      }
      // Define prazo (curto/longo) nos ativos/passivos. Itens com "Não Circulante" no nome viram longo prazo
      ['pl_felipe', 'pl_manu'].forEach(key => {
        const pl = merged[key];
        if (!pl) return;
        (pl.ativos || []).forEach(a => {
          if (!a.prazo) a.prazo = /n[ãa]o\s*cir/i.test(a.item || '') ? 'longo' : 'curto';
        });
        (pl.passivos || []).forEach(p => {
          if (!p.prazo) p.prazo = /n[ãa]o\s*cir/i.test(p.item || '') ? 'longo' : 'curto';
        });
      });
      // Reordena budget_despesas na ordem do SEED (preservando edições do usuário) + custom do usuário no final
      const seedIds = new Set(BUDGET_DESPESAS_SEED.map(s => s.id));
      const stateById = new Map((merged.budget_despesas || []).map(d => [d.id, d]));
      const customUsuario = (merged.budget_despesas || []).filter(d => !seedIds.has(d.id));
      const novoBudget = [];
      BUDGET_DESPESAS_SEED.forEach(seedD => {
        if (stateById.has(seedD.id)) novoBudget.push(stateById.get(seedD.id));
        else novoBudget.push(JSON.parse(JSON.stringify(seedD)));
      });
      customUsuario.forEach(c => novoBudget.push(c));
      merged.budget_despesas = novoBudget;
      return merged;
    }
  } catch(e) { console.warn('load fail', e); }
  return defaultState();
}

function saveStateLocal() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
}

let syncTimer = null;
let syncStatus = 'idle'; // idle | syncing | ok | error | off
function setSyncStatus(s) { syncStatus = s; atualizarStatusBar(); }

function saveState() {
  saveStateLocal();
  statusMsg('Salvo local ' + new Date().toLocaleTimeString('pt-BR'));
  if (STATE.config?.sync_url) {
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(syncUpload, 1500);
  }
}

async function syncUpload() {
  if (!STATE.config?.sync_url) { setSyncStatus('off'); return; }
  setSyncStatus('syncing');
  try {
    await fetch(STATE.config.sync_url, {
      method: 'POST',
      mode: 'cors',
      // text/plain evita preflight CORS no Apps Script
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(STATE),
    });
    setSyncStatus('ok');
  } catch (e) {
    console.error('sync upload fail', e);
    setSyncStatus('error');
  }
}

async function syncDownload(silencioso) {
  if (!STATE.config?.sync_url) { setSyncStatus('off'); return false; }
  setSyncStatus('syncing');
  try {
    const res = await fetch(STATE.config.sync_url + '?t=' + Date.now(), {method:'GET', mode:'cors'});
    const text = (await res.text()).trim();
    if (!text || text === 'null' || text === '{}') {
      setSyncStatus('ok');
      if (!silencioso) alert('A nuvem está vazia. Use "Enviar pra nuvem" uma vez pra subir os dados locais.');
      return false;
    }
    const remote = JSON.parse(text);
    if (remote && typeof remote === 'object' && remote.config) {
      STATE = remote;
      saveStateLocal();
      setSyncStatus('ok');
      if (!silencioso) statusMsg('Baixado da nuvem');
      return true;
    }
    setSyncStatus('error');
    return false;
  } catch (e) {
    console.error('sync download fail', e);
    setSyncStatus('error');
    if (!silencioso) alert('Erro ao baixar da nuvem: ' + e.message);
    return false;
  }
}

function atualizarStatusBar() {

function fmt(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}
// Versão com 2 casas decimais — usada no PL
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
// Formata pra input editável com separador de milhar (#.##0)
function formatNum(n) {
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '';
  return Math.round(Number(n)).toLocaleString('pt-BR');
}
// Formata pra input editável com 2 casas (#.##0,00)
function formatNum2(n) {
  if (n === null || n === undefined || n === '' || isNaN(Number(n))) return '';
  return Number(n).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
// Converte "4.500" ou "4500" ou "4.500,30" de volta pra número
function parseNum(s) {
  if (s === null || s === undefined || s === '') return 0;
  s = String(s).trim().replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function fmtSign(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const s = n >= 0 ? '+' : '';
  return s + fmt(n);
}

function calcOrcamentoAnual(d, ano) {
  if (d.tipo !== 'anual_acrual') return 0;
  const freq = d.frequencia_anual;
  if (freq != null && !isNaN(freq)) {
    const mesesDoAno = mesesAno(ano).length;
    // Orçamento do ano = valor_base × freq × (meses orçados / 12)
    // Em 2026 (8 meses orçados), é proporcional.
    // Em 2027 (12 meses), é cheio.
    return Number(d.valor_base) * Number(freq) * (mesesDoAno / 12);
  }
  // Fallback: orçamento_anual salvo explicitamente (dados antigos)
  return d.orcamento_anual?.[ano] || 0;
}

function ritmoAnualMensal(despesa, ano) {
  const anual = calcOrcamentoAnual(despesa, ano);
  const meses = mesesAno(ano).length;
  return meses > 0 ? anual / meses : 0;
}

function orcadoMesCategoria(despesa, chave_mes) {
  const mesData = SEMANAS_MES.find(m => m.chave_mes === chave_mes);
  if (!mesData) return 0;
  switch(despesa.tipo) {
    case 'mensal':
      return despesa.valor_base;
    case 'semanal':
      return despesa.valor_base * mesData.semanas;
    case 'data_fixa': {
      const o = (despesa.ocorrencias || []).find(x => x.chave_mes === chave_mes);
      return o ? o.valor : 0;
    }
    case 'anual_acrual':
      return ritmoAnualMensal(despesa, mesData.ano);
    default: return 0;
  }
}

function realizadoMesCategoria(categoria_id, chave_mes) {
  return STATE.lancamentos
    .filter(l => l.categoria_id === categoria_id && l.data.startsWith(chave_mes))
    .reduce((s, l) => s + Number(l.valor), 0);
}

function realizadoYTD(categoria_id, ano) {
  return STATE.lancamentos
    .filter(l => l.categoria_id === categoria_id && l.data.startsWith(String(ano) + '-'))
    .reduce((s, l) => s + Number(l.valor), 0);
}

function realizadoReceitaMes(pessoa, categoria, chave_mes) {
  return STATE.lancamentos_receitas
    .filter(r => r.pessoa === pessoa && r.categoria === categoria && r.data.startsWith(chave_mes))
    .reduce((s, r) => s + Number(r.valor), 0);
}

function orcadoTotalDespesasMes(chave_mes) {
  return STATE.budget_despesas.reduce((s, d) => s + orcadoMesCategoria(d, chave_mes), 0);
}

function realizadoTotalDespesasMes(chave_mes) {
  return STATE.lancamentos
    .filter(l => l.data.startsWith(chave_mes))
    .reduce((s, l) => s + Number(l.valor), 0);
}

function orcadoTotalReceitasMes(chave_mes) {
  return STATE.budget_receitas.filter(r => r.chave_mes === chave_mes).reduce((s, r) => s + Number(r.valor_orcado), 0);
}

function realizadoTotalReceitasMes(chave_mes) {
  return STATE.lancamentos_receitas
    .filter(r => r.data.startsWith(chave_mes))
    .reduce((s, r) => s + Number(r.valor), 0);
}

function plPessoa(pl) {
  const ativos = pl.ativos.reduce((s, a) => s + Number(a.valor), 0);
  const passivos = pl.passivos.reduce((s, p) => s + Number(p.valor), 0);
  return ativos - passivos;
}
function plFelipe() { return plPessoa(STATE.pl_felipe); }
function plManu() { return plPessoa(STATE.pl_manu); }
function plCasal() { return plFelipe() + plManu(); }

// Registra snapshot diário do PL (1 entrada por dia, sobrescreve se já existe)
function registrarSnapshotPL() {
  STATE.historico_pl = STATE.historico_pl || [];
  const hoje = new Date().toISOString().slice(0,10);
  const agora = new Date().toISOString();
  const snapshot = {
    data: hoje,
    timestamp: agora,
    pl_felipe: plFelipe(),
    pl_manu: plManu(),
    pl_casal: plCasal(),
  };
  const idx = STATE.historico_pl.findIndex(s => s.data === hoje);
  if (idx >= 0) STATE.historico_pl[idx] = snapshot;
  else STATE.historico_pl.push(snapshot);
}

// Saldo orçamentário pendente entre mes_ativo e horizonte (inclusive)
function saldoPendenteAte(chave_fim) {
  const ma = STATE.config.mes_ativo;
  const meses = mesesEntre(ma, chave_fim);
  let recPend = 0, despPend = 0;
  meses.forEach(m => {
    // Receitas
    STATE.budget_receitas.filter(r => r.chave_mes === m).forEach(r => {
      const rec = realizadoReceitaMes(r.pessoa, r.categoria, m);
      if (m === ma) {
        recPend += Math.max(0, r.valor_orcado - rec);
      } else {
        recPend += Number(r.valor_orcado);
      }
    });
    // Despesas
    STATE.budget_despesas.forEach(d => {
      const orc = orcadoMesCategoria(d, m);
      const rea = realizadoMesCategoria(d.id, m);
      if (m === ma) {
        despPend += Math.max(0, orc - rea);
      } else {
        despPend += orc;
      }
    });
  });
  return recPend - despPend;
}

function plProjetadoHorizonte(chave_fim) {
  return plCasal() + saldoPendenteAte(chave_fim);
}

// Calcula quanto foi absorvido de Extras/Lazer por estouros de outras categorias
function absorvidoExtrasMes(chave_mes) {
  let absorvido = 0;
  // 1) Estouros mensais de categorias mensal/data_fixa/semanal
  STATE.budget_despesas.forEach(d => {
    if (d.id === 'extras_lazer') return;
    if (d.tipo === 'mensal' || d.tipo === 'data_fixa' || d.tipo === 'semanal') {
      const o = orcadoMesCategoria(d, chave_mes);
      const r = realizadoMesCategoria(d.id, chave_mes);
      if (r > o) absorvido += (r - o);
    }
  });
  // 2) Estouros anuais de categorias acrua anualmente — rateio uniforme pelos meses do ano
  const mesData = SEMANAS_MES.find(m => m.chave_mes === chave_mes);
  if (mesData) {
    const ano = mesData.ano;
    const nMesesAno = mesesAno(ano).length;
    if (nMesesAno > 0) {
      STATE.budget_despesas.forEach(d => {
        if (d.tipo !== 'anual_acrual') return;
        const anual = d.orcamento_anual?.[ano] || 0;
        const ytd = realizadoYTD(d.id, ano);
        if (anual > 0 && ytd > anual) {
          absorvido += (ytd - anual) / nMesesAno;
        }
      });
    }
  }
  return absorvido;
}

// Mesma lógica de absorvidoExtrasMes, mas devolvendo breakdown por categoria
function absorvidoDetalhadoMes(chave_mes) {
  const itens = [];
  STATE.budget_despesas.forEach(d => {
    if (d.id === 'extras_lazer') return;
    if (d.tipo === 'mensal' || d.tipo === 'data_fixa' || d.tipo === 'semanal') {
      const o = orcadoMesCategoria(d, chave_mes);
      const r = realizadoMesCategoria(d.id, chave_mes);
      if (r > o) itens.push({
        categoria_id: d.id, categoria: d.categoria, grupo: d.grupo, tipo: d.tipo,
        valor: r - o, motivo: 'Estouro do mês'
      });
    }
  });
  const mesData = SEMANAS_MES.find(m => m.chave_mes === chave_mes);
  if (mesData) {
    const ano = mesData.ano;
    const nMesesAno = mesesAno(ano).length;
    if (nMesesAno > 0) {
      STATE.budget_despesas.forEach(d => {
        if (d.tipo !== 'anual_acrual') return;
        const anual = d.orcamento_anual?.[ano] || 0;
        const ytd = realizadoYTD(d.id, ano);
        if (anual > 0 && ytd > anual) itens.push({
          categoria_id: d.id, categoria: d.categoria, grupo: d.grupo, tipo: d.tipo,
          valor: (ytd - anual) / nMesesAno,
          motivo: `Estouro anual rateado (${ano})`
        });
      });
    }
  }
  return itens;
}

// Extras/Lazer: saldo do mês (absorve estouros das outras categorias)
function saldoExtrasLazerMes(chave_mes) {
  const extras = STATE.budget_despesas.find(d => d.id === 'extras_lazer');
  if (!extras) return 0;
  const orcado = orcadoMesCategoria(extras, chave_mes);
  const realExtras = realizadoMesCategoria('extras_lazer', chave_mes);
  return orcado - realExtras - absorvidoExtrasMes(chave_mes);
}

        <div class="label">Despesa Realizada</div>
        <div class="value">R$ ${fmt(despR)}</div>
        <div class="sub">Orçada: R$ ${fmt(despO)} (${pctDespesa.toFixed(0)}%)</div>
        <div class="bar"><div class="bar-fill ${pctDespesa > 100 ? 'bad' : pctDespesa > 85 ? 'warn' : ''}" style="width:${Math.min(100, pctDespesa)}%"></div></div>
      </div>
      <div class="card ${resultR >= 0 ? 'good' : 'bad'}">
        <div class="label">Resultado Realizado</div>
        <div class="value">R$ ${fmt(resultR)}</div>
        <div class="sub">Orçado: R$ ${fmt(resultO)}</div>
      </div>
      <div class="card">
        <div class="label">Saldo Extras/Lazer</div>
        <div class="value ${outrosSaldo < 0 ? 'num-bad':'num-good'}">R$ ${fmt(outrosSaldo)}</div>
        <div class="sub">Folga do mês após absorver estouros</div>
      </div>
    </div>

    <div class="section">
      <h3>Consumo por categoria — ${mesInfo.mes_nome}</h3>
      <table>
        <thead><tr><th>Categoria</th><th class="num">Orçado</th><th class="num">Realizado</th><th class="num">Saldo</th><th>Status</th></tr></thead>
        <tbody>
          ${(function(){
            const fechadosDash = STATE.ui?.grupos_fechados_dashboard || [];
            const absorvido = absorvidoExtrasMes(ma);
            return ['Fixa Felipe','Fixa Manu','Variável'].map(grupo => {
              const despGrupo = STATE.budget_despesas.filter(d => d.grupo === grupo);
              const fechado = fechadosDash.includes(grupo);
              const linhasData = despGrupo.map(d => {
                const o = orcadoMesCategoria(d, ma);
                let r = realizadoMesCategoria(d.id, ma);
                // Extras/Lazer reflete o que foi absorvido de estouros de outras categorias
                if (d.id === 'extras_lazer') r += absorvido;
                const s = o - r;
                if (o === 0 && r === 0) return null;
                let status = 'ok', statusLabel = 'OK';
                if (d.tipo === 'anual_acrual') {
                  const ano = mesInfo.ano;
                  const anual = d.orcamento_anual?.[ano] || 0;
                  const ytd = realizadoYTD(d.id, ano);
                  statusLabel = `Limite Anual: ${fmt(ytd)} / ${fmt(anual)}`;

                  if (o > 0 && r >= o) { status = 'estouro'; statusLabel = 'LIMITE ATINGIDO'; }

                return {d, o, r, s, status, statusLabel, hint};

              const totalO = linhasData.reduce((acc, x) => acc + x.o, 0);
              const totalR = linhasData.reduce((acc, x) => acc + x.r, 0);
              const totalS = totalO - totalR;

              const linhas = linhasData.map(x => `<tr>
                  <td>${x.d.categoria}${x.hint}</td>
                  <td class="num">${fmt(x.o)}</td>
                  <td class="num">${fmt(x.r)}</td>
                  <td class="num ${x.s < 0 ? 'num-bad' : ''}">${fmt(x.s)}</td>
                  <td><span class="badge ${x.status}">${x.statusLabel}</span></td>
                </tr>`).join('');

              const header = `<tr class="dash-grupo-header" onclick="app.toggleGrupoDashboard('${grupo}')">

                <td class="num">${fmt(totalR)}</td>
                <td class="num ${totalS < 0 ? 'num-bad' : ''}">${fmt(totalS)}</td>
                <td></td>
              </tr>`;
              return header + (fechado ? '' : linhas);
            }).join('');
          })()}
        </tbody>
      </table>
    </div>
  `;
};

// ----- ORÇAMENTO DESPESAS (matriz horizontal) -----
VIEWS_FN.orcamento_despesas = function() {
  const grupos = ['Fixa Felipe', 'Fixa Manu', 'Variável'];
  const MESES = getMesesVisiveis();
  const nMeses = MESES.length;
  const nCols = 1 + nMeses + 3;
  const filtrando = !!STATE.ui?.filtrar_mes;
  const mesAtivoNome = SEMANAS_MES.find(m => m.chave_mes === STATE.config.mes_ativo)?.mes_nome || '';

  let html = `
    <h2>Orçamento de Despesas</h2>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn btn-small ${filtrando ? '' : 'ghost'}" onclick="app.toggleFiltroMes()">
        ${filtrando ? `📅 Mostrando de ${mesAtivoNome} em diante` : '📅 Mostrar a partir do mês ativo'}
      </button>
    </div>
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>
          <tr>
            <th class="sticky-col">Categoria</th>
            ${MESES.map(m => `<th class="num">${m.mes_nome}</th>`).join('')}
            <th class="num tcol tcol-1">Total 2026</th>
            <th class="num tcol tcol-2">Total 2027</th>
            <th class="num tcol tcol-3">Total 26-27</th>
          </tr>
        </thead>
        <tbody>`;

  const fechados = STATE.ui?.grupos_fechados || [];
  grupos.forEach(g => {
    const despGrupo = STATE.budget_despesas.filter(d => d.grupo === g);
    if (despGrupo.length === 0) return;
    const fechado = fechados.includes(g);
    html += `<tr class="group-header" onclick="app.toggleGrupo('${g}')" style="cursor:pointer">
      <td colspan="${nCols}"><span style="display:inline-block;width:16px">${fechado ? '▶' : '▼'}</span> ${g}</td>
    </tr>`;

    const subMes = new Array(nMeses).fill(0);
    despGrupo.forEach(d => {
      const vals = MESES.map(m => orcadoMesCategoria(d, m.chave_mes));
      vals.forEach((v, i) => subMes[i] += v);
      if (fechado) return;
      const t26 = vals.reduce((s,v,i) => s + (MESES[i].ano === 2026 ? v : 0), 0);
      const t27 = vals.reduce((s,v,i) => s + (MESES[i].ano === 2027 ? v : 0), 0);
      const tot = t26 + t27;
      html += `<tr>
        <td class="sticky-col"><a class="cat-link" onclick="app.abrirModalDespesa('${d.id}')">${d.categoria}</a></td>
        ${vals.map(v => `<td class="num ${v === 0 ? 'zero':''}">${v === 0 ? '—' : fmt(v)}</td>`).join('')}
        <td class="num tcol tcol-1">${fmt(t26)}</td>
        <td class="num tcol tcol-2">${fmt(t27)}</td>
        <td class="num tcol tcol-3">${fmt(tot)}</td>
      </tr>`;
    });

    const sub26 = subMes.reduce((s,v,i) => s + (MESES[i].ano === 2026 ? v : 0), 0);
    const sub27 = subMes.reduce((s,v,i) => s + (MESES[i].ano === 2027 ? v : 0), 0);
    const subTot = sub26 + sub27;
    html += `<tr class="subtotal-row">
      <td class="sticky-col">Subtotal ${g}</td>
      ${subMes.map(v => `<td class="num">${fmt(v)}</td>`).join('')}
      <td class="num tcol tcol-1">${fmt(sub26)}</td>
      <td class="num tcol tcol-2">${fmt(sub27)}</td>
      <td class="num tcol tcol-3">${fmt(subTot)}</td>
    </tr>`;
  });

  // Linha total por mês
  const totalMes = MESES.map(m => orcadoTotalDespesasMes(m.chave_mes));
  const totalMes2026 = MESES.reduce((s,m,i) => s + (m.ano === 2026 ? totalMes[i] : 0), 0);
  const totalMes2027 = MESES.reduce((s,m,i) => s + (m.ano === 2027 ? totalMes[i] : 0), 0);
  const totalGeral = totalMes2026 + totalMes2027;
  html += `<tr class="total-row">
    <td class="sticky-col"><strong>TOTAL</strong></td>
    ${totalMes.map(v => `<td class="num">${fmt(v)}</td>`).join('')}
    <td class="num tcol tcol-1">${fmt(totalMes2026)}</td>
    <td class="num tcol tcol-2">${fmt(totalMes2027)}</td>
    <td class="num tcol tcol-3">${fmt(totalGeral)}</td>
  </tr>`;

  html += `</tbody></table></div>
    <div style="margin-top:12px"><button class="btn" onclick="app.abrirModalNovaDespesa()">+ Nova categoria</button></div>`;
  return html;
};

// ----- ORÇAMENTO RECEITAS (matriz horizontal) -----
VIEWS_FN.orcamento_receitas = function() {
  const MESES = getMesesVisiveis();
  const nMeses = MESES.length;
  const nCols = 1 + nMeses + 3;
  const filtrando = !!STATE.ui?.filtrar_mes;
  const mesAtivoNome = SEMANAS_MES.find(m => m.chave_mes === STATE.config.mes_ativo)?.mes_nome || '';
  const linhasMap = new Map();
  STATE.budget_receitas.forEach(r => {
    const key = r.pessoa + '||' + r.categoria;
    if (!linhasMap.has(key)) linhasMap.set(key, {pessoa: r.pessoa, categoria: r.categoria});
  });
  const linhas = Array.from(linhasMap.values());
  const ORDEM_RECEITAS = ['Salário', 'VA', 'VR', '13º e 14º', 'Auxílio Natal'];
  linhas.sort((a,b) => {
    if (a.pessoa !== b.pessoa) return a.pessoa === 'Felipe' ? -1 : 1;
    const ai = ORDEM_RECEITAS.indexOf(a.categoria);
    const bi = ORDEM_RECEITAS.indexOf(b.categoria);
    const ao = ai === -1 ? 999 : ai;
    const bo = bi === -1 ? 999 : bi;
    if (ao !== bo) return ao - bo;
    return a.categoria.localeCompare(b.categoria);
  });

  let html = `
    <h2>Orçamento de Receitas</h2>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:flex-end">
      <button class="btn btn-small ${filtrando ? '' : 'ghost'}" onclick="app.toggleFiltroMes()">
        ${filtrando ? `📅 Mostrando de ${mesAtivoNome} em diante` : '📅 Mostrar a partir do mês ativo'}
      </button>
    </div>
    <div class="matrix-wrap">
      <table class="matrix">
        <thead>
          <tr>
            <th class="sticky-col">Pessoa · Categoria</th>
            ${MESES.map(m => `<th class="num">${m.mes_nome}</th>`).join('')}
            <th class="num tcol tcol-1">Total 2026</th>
            <th class="num tcol tcol-2">Total 2027</th>
            <th class="num tcol tcol-3">Total 26-27</th>
          </tr>
        </thead>
        <tbody>`;

  const fechadosRec = STATE.ui?.grupos_fechados_receitas || [];
  ['Felipe','Manuella'].forEach(pessoa => {
    const suas = linhas.filter(l => l.pessoa === pessoa);
    if (suas.length === 0) return;
    const fechado = fechadosRec.includes(pessoa);
    html += `<tr class="group-header" onclick="app.toggleGrupoReceita('${pessoa}')" style="cursor:pointer">
      <td colspan="${nCols}"><span style="display:inline-block;width:16px">${fechado ? '▶' : '▼'}</span> ${pessoa}</td>
    </tr>`;

    const subMes = new Array(nMeses).fill(0);
    suas.forEach(l => {
      const vals = MESES.map(m => {
        const r = STATE.budget_receitas.find(x => x.pessoa === l.pessoa && x.categoria === l.categoria && x.chave_mes === m.chave_mes);
        return r ? r.valor_orcado : 0;
      });
      vals.forEach((v, i) => subMes[i] += v);
      if (fechado) return;
      const t26 = vals.reduce((s,v,i) => s + (MESES[i].ano === 2026 ? v : 0), 0);
      const t27 = vals.reduce((s,v,i) => s + (MESES[i].ano === 2027 ? v : 0), 0);
      const tot = t26 + t27;
      html += `<tr>
        <td class="sticky-col"><a class="cat-link" onclick="app.abrirModalReceita('${encodeURIComponent(l.pessoa)}','${encodeURIComponent(l.categoria)}')">${l.categoria}</a></td>
        ${MESES.map((m, i) => `<td class="num"><input type="text" inputmode="decimal" class="cell-edit" value="${vals[i] > 0 ? formatNum(vals[i]) : ''}" onfocus="this.value = parseNum(this.value) || ''" onblur="this.value = formatNum(this.value)" onchange="app.editReceitaCel('${encodeURIComponent(l.pessoa)}','${encodeURIComponent(l.categoria)}','${m.chave_mes}',parseNum(this.value))" placeholder="—"></td>`).join('')}
        <td class="num tcol tcol-1">${fmt(t26)}</td>
        <td class="num tcol tcol-2">${fmt(t27)}</td>
        <td class="num tcol tcol-3">${fmt(tot)}</td>
      </tr>`;
    });

    const sub26 = subMes.reduce((s,v,i) => s + (MESES[i].ano === 2026 ? v : 0), 0);
    const sub27 = subMes.reduce((s,v,i) => s + (MESES[i].ano === 2027 ? v : 0), 0);
    const subTot = sub26 + sub27;
    html += `<tr class="subtotal-row">
      <td class="sticky-col">Subtotal ${pessoa}</td>
      ${subMes.map(v => `<td class="num">${fmt(v)}</td>`).join('')}
      <td class="num tcol tcol-1">${fmt(sub26)}</td>
      <td class="num tcol tcol-2">${fmt(sub27)}</td>
      <td class="num tcol tcol-3">${fmt(subTot)}</td>
    </tr>`;
  });

  const totalMes = MESES.map(m => orcadoTotalReceitasMes(m.chave_mes));
  const totalMes2026 = MESES.reduce((s,m,i) => s + (m.ano === 2026 ? totalMes[i] : 0), 0);
  const totalMes2027 = MESES.reduce((s,m,i) => s + (m.ano === 2027 ? totalMes[i] : 0), 0);
  const totalGeral = totalMes2026 + totalMes2027;
  html += `<tr class="total-row">
    <td class="sticky-col"><strong>TOTAL</strong></td>
    ${totalMes.map(v => `<td class="num">${fmt(v)}</td>`).join('')}
    <td class="num tcol tcol-1">${fmt(totalMes2026)}</td>
    <td class="num tcol tcol-2">${fmt(totalMes2027)}</td>
    <td class="num tcol tcol-3">${fmt(totalGeral)}</td>
  </tr>`;

  html += `</tbody></table></div>
    <div style="margin-top:12px"><button class="btn" onclick="app.abrirModalReceitaNova()">+ Nova linha de receita</button></div>`;
  return html;
};

// ----- HISTÓRICO DE LANÇAMENTOS -----
VIEWS_FN.lancamentos_historico = function() {
  STATE.ui = STATE.ui || {};
  const fMesD = STATE.ui.hist_filtro_mes_d || '';
  const fGrupoD = STATE.ui.hist_filtro_grupo_d || '';
  const fCatD = STATE.ui.hist_filtro_cat_d || '';
  const fMesR = STATE.ui.hist_filtro_mes_r || '';
  const fCatR = STATE.ui.hist_filtro_cat_r || '';

  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Filtra despesas
  let lancD = [...STATE.lancamentos];
  if (fMesD) lancD = lancD.filter(l => l.data === fMesD);
  if (fGrupoD) {
    const idsDoGrupo = new Set(STATE.budget_despesas.filter(d => d.grupo === fGrupoD).map(d => d.id));
    lancD = lancD.filter(l => idsDoGrupo.has(l.categoria_id));
  }
  if (fCatD) lancD = lancD.filter(l => l.categoria_id === fCatD);
  lancD.sort((a,b) => b.data.localeCompare(a.data));

  // Filtra receitas
  let lancR = [...STATE.lancamentos_receitas];
  if (fMesR) lancR = lancR.filter(l => l.data === fMesR);
  if (fCatR) lancR = lancR.filter(l => l.categoria === fCatR);
  lancR.sort((a,b) => b.data.localeCompare(a.data));

  // Options de mês (todos os meses do horizonte)
  const mesOpts = (sel) => `<option value="">Todos os meses</option>` +
    SEMANAS_MES.map(m => `<option value="${m.chave_mes}" ${m.chave_mes === sel ? 'selected' : ''}>${m.mes_nome}</option>`).join('');

  // Categorias de despesa agrupadas por "grupo"
  const grupos = [...new Set(STATE.budget_despesas.map(d => d.grupo))];
  const grupoFiltroOpts = `<option value="">Todos os grupos</option>` +
    grupos.map(g => `<option value="${esc(g)}" ${g === fGrupoD ? 'selected' : ''}>${esc(g)}</option>`).join('');
  // Para o dropdown de categoria por linha (edição): sempre mostra todas
  const catDOptsBase = (selId) => grupos.map(g =>
    `<optgroup label="${esc(g)}">` +
      STATE.budget_despesas.filter(d => d.grupo === g).map(d =>
        `<option value="${d.id}" ${d.id === selId ? 'selected' : ''}>${esc(d.categoria)}</option>`
      ).join('') +
    `</optgroup>`
  ).join('');
  // Para o dropdown do filtro: respeita o grupo selecionado (mostra só categorias daquele grupo)
  const gruposVisiveis = fGrupoD ? [fGrupoD] : grupos;
  const catDFiltroOpts = `<option value="">Todas as categorias</option>` + gruposVisiveis.map(g =>
    `<optgroup label="${esc(g)}">` +
      STATE.budget_despesas.filter(d => d.grupo === g).map(d =>
        `<option value="${d.id}" ${d.id === fCatD ? 'selected' : ''}>${esc(d.categoria)}</option>`
      ).join('') +
    `</optgroup>`
  ).join('');

  // Categorias de receita únicas (do orçamento + dos lançamentos)
  const catsRSet = new Set([
    ...STATE.budget_receitas.map(r => r.categoria),
    ...STATE.lancamentos_receitas.map(l => l.categoria),
  ]);
  const catsR = [...catsRSet].sort();
  const catRFiltroOpts = `<option value="">Todas as categorias</option>` +
    catsR.map(c => `<option value="${esc(c)}" ${c === fCatR ? 'selected' : ''}>${esc(c)}</option>`).join('');

  // Totais filtrados
  const totalD = lancD.reduce((s,l) => s + Number(l.valor), 0);
  const totalR = lancR.reduce((s,l) => s + Number(l.valor), 0);

  const linhaDesp = (l) => {
    const cat = STATE.budget_despesas.find(d => d.id === l.categoria_id);
    const mesNome = SEMANAS_MES.find(m => m.chave_mes === l.data)?.mes_nome || l.data;
    return `<tr>
      <td>${mesNome}</td>
      <td>${esc(l.autor)}</td>
      <td>${cat ? esc(cat.categoria) : '?'}</td>
      <td class="num">${fmt(l.valor)}</td>
      <td class="muted">${esc(l.descricao || '')}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-small ghost" onclick="app.abrirModalEditarLanc('${l.id}')" title="Editar">✏️</button>
        <button class="btn btn-small danger" onclick="app.deleteLancamento('${l.id}')">🗑</button>
      </td>
    </tr>`;
  };

  const linhaRec = (l) => `<tr>
    <td><select onchange="app.editLancRec('${l.id}','data',this.value)">
      ${SEMANAS_MES.map(m => `<option value="${m.chave_mes}" ${m.chave_mes === l.data ? 'selected' : ''}>${m.mes_nome}</option>`).join('')}
    </select></td>

function viewPL(pessoa) {
  const key = pessoa === 'Felipe' ? 'pl_felipe' : 'pl_manu';
  const pl = STATE[key];

  // Soma por prazo
  const sumByPrazo = (arr, prazo) => arr.filter(x => (x.prazo || 'curto') === prazo).reduce((s,x) => s + Number(x.valor || 0), 0);
  const ativosCurto = sumByPrazo(pl.ativos, 'curto');
  const ativosLongo = sumByPrazo(pl.ativos, 'longo');
  const passivosCurto = sumByPrazo(pl.passivos, 'curto');
  const passivosLongo = sumByPrazo(pl.passivos, 'longo');
  const totAtivos = ativosCurto + ativosLongo;
  const totPassivos = passivosCurto + passivosLongo;
  const total = totAtivos - totPassivos;

  // Render de uma linha — usa o índice absoluto no array original
  const linha = (item, idx, grupo) => `<tr class="pl-row"
    draggable="true"
    data-pessoa="${pessoa}" data-grupo="${grupo}" data-idx="${idx}" data-prazo="${item.prazo || 'curto'}"
    ondragstart="app.plDragStart(event)"
    ondragover="app.plDragOver(event)"
    ondragleave="app.plDragLeave(event)"
    ondrop="app.plDrop(event)"
    ondragend="app.plDragEnd(event)">
    <td class="pl-handle" title="Arrastar para reordenar / mover entre Curto e Longo Prazo">☰</td>
    <td><input type="text" data-pessoa="${pessoa}" data-grupo="${grupo}" data-idx="${idx}" data-field="item" value="${(item.item || '').replace(/"/g,'&quot;')}" onchange="app.editPL(event)"></td>
    <td><input type="text" inputmode="decimal" class="num" data-pessoa="${pessoa}" data-grupo="${grupo}" data-idx="${idx}" data-field="valor" data-prazo="${item.prazo || 'curto'}" value="${formatNum2(item.valor)}" onfocus="this.value = parseNum(this.value) || ''" oninput="app.recalcPL('${pessoa}')" onblur="this.value = formatNum2(this.value); app.recalcPL('${pessoa}')" onchange="app.editPL(event)"></td>
    <td style="white-space:nowrap;">
      <button class="btn btn-small danger" onclick="app.deletePLLinha('${pessoa}','${grupo}',${idx})">🗑</button>
    </td>
  </tr>`;

  // Helper pra renderizar a sub-tabela de um prazo
  const subtabela = (arr, grupo, prazo, subId) => {
    const idxComPrazo = arr.map((x, i) => ({x, i})).filter(({x}) => (x.prazo || 'curto') === prazo);
    const subtotal = idxComPrazo.reduce((s, {x}) => s + Number(x.valor || 0), 0);
    return `
      <table>
        <thead><tr><th style="width:1%;"></th><th>Item</th><th class="num">Valor</th><th style="width:1%;"></th></tr></thead>
        <tbody>
          ${idxComPrazo.length === 0 ? `<tr class="pl-empty-row" data-pessoa="${pessoa}" data-grupo="${grupo}" data-prazo="${prazo}" ondragover="app.plDragOver(event)" ondragleave="app.plDragLeave(event)" ondrop="app.plDrop(event)"><td colspan="4" class="muted" style="text-align:center; padding:12px;">— sem itens — (arraste aqui para mover)</td></tr>` : idxComPrazo.map(({x, i}) => linha(x, i, grupo)).join('')}
        </tbody>
        <tfoot><tr class="pl-subtotal-row" data-pessoa="${pessoa}" data-grupo="${grupo}" data-prazo="${prazo}" data-end="1"
          ondragover="app.plDragOver(event)" ondragleave="app.plDragLeave(event)" ondrop="app.plDrop(event)">
          <td></td>
          <td>Subtotal ${prazo === 'longo' ? 'Longo Prazo' : 'Curto Prazo'}</td>
          <td class="num"><span id="${subId}">R$ ${fmtMoney(subtotal)}</span></td>
          <td></td>
        </tr></tfoot>
      </table>
      <button class="btn btn-small" style="margin-top:8px" onclick="app.addPLLinha('${pessoa}','${grupo}','${prazo}')">+ Adicionar (${prazo === 'longo' ? 'longo' : 'curto'} prazo)</button>
    `;
  };

  return `
    <h2>PL — ${pessoa}</h2>
    <div class="cards">
      <div class="card good"><div class="label">Total Ativos</div><div class="value">R$ <span id="pl-${pessoa}-tot-ativos">${fmtMoney(totAtivos)}</span></div></div>
      <div class="card bad"><div class="label">Total Passivos</div><div class="value">R$ <span id="pl-${pessoa}-tot-passivos">${fmtMoney(totPassivos)}</span></div></div>
      <div class="card ${total>=0?'good':'bad'}"><div class="label">PL Total</div><div class="value">R$ <span id="pl-${pessoa}-tot-pl">${fmtMoney(total)}</span></div></div>
    </div>

    <div class="section">
      <h3>Ativos — Curto Prazo</h3>
      ${subtabela(pl.ativos, 'ativos', 'curto', `pl-${pessoa}-ac-sub`)}
      <h3 style="margin-top:24px;">Ativos — Longo Prazo</h3>
      ${subtabela(pl.ativos, 'ativos', 'longo', `pl-${pessoa}-al-sub`)}
    </div>

    <div class="section">
      <h3>Passivos — Curto Prazo</h3>
      ${subtabela(pl.passivos, 'passivos', 'curto', `pl-${pessoa}-pc-sub`)}
      <h3 style="margin-top:24px;">Passivos — Longo Prazo</h3>
      ${subtabela(pl.passivos, 'passivos', 'longo', `pl-${pessoa}-pl-sub`)}
    </div>
  `;
}

// ----- PROJEÇÕES (fluxo de caixa mês a mês) -----
// Helper: receitas e despesas pendentes de um mês
function pendenteMes(chave_mes) {
  const ma = STATE.config.mes_ativo;
  let rec = 0, desp = 0;
  STATE.budget_receitas.filter(r => r.chave_mes === chave_mes).forEach(r => {
    const real = realizadoReceitaMes(r.pessoa, r.categoria, chave_mes);
    rec += chave_mes === ma ? Math.max(0, r.valor_orcado - real) : Number(r.valor_orcado);
  });
  STATE.budget_despesas.forEach(d => {
    const orc = orcadoMesCategoria(d, chave_mes);
    const rea = realizadoMesCategoria(d.id, chave_mes);
    desp += chave_mes === ma ? Math.max(0, orc - rea) : orc;
  });
  return {rec, desp};
}

VIEWS_FN.pl_projetado = function() {
  const ma = STATE.config.mes_ativo;
  const plAtual = plCasal();
  const meses = SEMANAS_MES.filter(m => m.chave_mes >= ma);
  const ultimoMes = meses[meses.length - 1]?.chave_mes || ma;

  STATE.ui = STATE.ui || {};
  let projDe = STATE.ui.proj_filtro_de || ma;
  let projAte = STATE.ui.proj_filtro_ate || ultimoMes;
  // Clamp se mês ativo mudou e os limites ficaram fora de faixa
  if (projDe < ma) projDe = ma;
  if (projAte > ultimoMes) projAte = ultimoMes;
  if (projAte < projDe) projAte = projDe;

  // Acumulado do período selecionado — usa orçado integral, independente do realizado
  const mesesPeriodo = SEMANAS_MES.filter(m => m.chave_mes >= projDe && m.chave_mes <= projAte);
  let recAcum = 0, despAcum = 0;
  mesesPeriodo.forEach(m => {
    recAcum += orcadoTotalReceitasMes(m.chave_mes);
    despAcum += orcadoTotalDespesasMes(m.chave_mes);
  });
  const lucroAcum = recAcum - despAcum;

  // Calcula BoP / Receitas / Despesas / EoP encadeado mês a mês
  let bop = plAtual;
  const colunas = meses.map(m => {
    const {rec, desp} = pendenteMes(m.chave_mes);
    const eop = bop + rec - desp;
    const row = {chave_mes: m.chave_mes, mes_nome: m.mes_nome, bop, rec, desp, eop};
    bop = eop;
    return row;
  });

  const mesOpts = (sel, minMes) => SEMANAS_MES
    .filter(m => m.chave_mes >= (minMes || ma))
    .map(m => `<option value="${m.chave_mes}" ${m.chave_mes === sel ? 'selected' : ''}>${m.mes_nome}</option>`)
    .join('');

  return `
    <h2>Projeções</h2>
    <div class="card" style="margin-bottom:16px">
      <div class="label">PL Casal hoje (BoP inicial)</div>

  atualizarValorDespesa(form) {
    const cat_id = form.querySelector('[name="categoria_id"]')?.value;
    const mes = form.querySelector('[name="data"]')?.value;
    const inputValor = form.querySelector('[name="valor"]');
    if (!cat_id || !mes || !inputValor) return;
    const d = STATE.budget_despesas.find(x => x.id === cat_id);
    if (!d) return;
    const valor = orcadoMesCategoria(d, mes);
    if (valor > 0) inputValor.value = Math.round(valor);
    this.atualizarPreviewParcelas(form);
  },
  toggleParcelas(form) {
    const checked = form.querySelector('[name="parcelar"]').checked;
    const row = document.getElementById('parcelas-row');
    if (row) row.style.display = checked ? 'grid' : 'none';
    this.atualizarPreviewParcelas(form);
  },
  atualizarPreviewParcelas(form) {
    const preview = document.getElementById('parcelas-preview');
    if (!preview) return;
    const parcelar = form.querySelector('[name="parcelar"]')?.checked;
    if (!parcelar) { preview.textContent = ''; return; }
    const valor = parseFloat(form.querySelector('[name="valor"]')?.value) || 0;
    const n = Math.max(2, parseInt(form.querySelector('[name="parcelas"]')?.value) || 2);
    const mesBase = form.querySelector('[name="data"]')?.value;
    if (!mesBase || !valor) { preview.textContent = ''; return; }
    const idxBase = SEMANAS_MES.findIndex(m => m.chave_mes === mesBase);
    if (idxBase < 0) { preview.textContent = ''; return; }
    const meses = [];
    for (let i = 0; i < n && idxBase + i < SEMANAS_MES.length; i++) {
      meses.push(SEMANAS_MES[idxBase + i].mes_nome);
    }
    const parcelaValor = valor / n;
    const fora = n - meses.length;
    const aviso = fora > 0 ? ` ⚠️ ${fora} parcela(s) fora do horizonte` : '';
    preview.textContent = `→ ${n}x de R$ ${parcelaValor.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2})} (${meses.join(', ')})${aviso}`;
  },
  atualizarValorReceita(form) {
    const pessoa = form.querySelector('[name="pessoa"]')?.value;
    const categoria = form.querySelector('[name="categoria"]')?.value;
    const mes = form.querySelector('[name="data"]')?.value;
    const inputValor = form.querySelector('[name="valor"]');
    if (!pessoa || !categoria || !mes || !inputValor) return;
    const r = STATE.budget_receitas.find(x => x.pessoa === pessoa && x.categoria === categoria && x.chave_mes === mes);
    if (r && r.valor_orcado > 0) inputValor.value = Math.round(r.valor_orcado);
  },

  salvarLancamentoDespesa(e) {
    const f = new FormData(e.target);
    const valor = parseFloat(f.get('valor')) || 0;
    const dataBase = f.get('data');
    const autor = f.get('autor');
    const categoria_id = f.get('categoria_id');
    const descricaoBase = f.get('descricao') || '';
    const parcelar = f.get('parcelar') === 'on';
    const n = parcelar ? Math.max(2, Math.min(24, parseInt(f.get('parcelas')) || 2)) : 1;

    if (n === 1) {
      STATE.lancamentos.push({
        id: 'l_' + Date.now(),
        data: dataBase,
        autor, categoria_id, valor,
        descricao: descricaoBase,
      });
      statusMsg('Despesa lançada!');
    } else {
      const idxBase = SEMANAS_MES.findIndex(m => m.chave_mes === dataBase);
      if (idxBase < 0) { alert('Mês base inválido.'); return; }
      const cabem = Math.min(n, SEMANAS_MES.length - idxBase);
      if (cabem < n && !confirm(`Só cabem ${cabem} de ${n} parcelas no horizonte (até dez-27). Criar mesmo assim ${cabem} parcelas?`)) return;
      const grupoId = 'pg_' + Date.now();
      // Divide em centavos pra não acumular erro; última parcela absorve o resto
      const totalCent = Math.round(valor * 100);
      const baseCent = Math.floor(totalCent / cabem);
      const restoCent = totalCent - baseCent * cabem;
      for (let i = 0; i < cabem; i++) {
        const mes = SEMANAS_MES[idxBase + i].chave_mes;
        const vCent = (i === cabem - 1) ? baseCent + restoCent : baseCent;
        STATE.lancamentos.push({
          id: 'l_' + Date.now() + '_' + i,
          data: mes,
          autor, categoria_id,
          valor: vCent / 100,
          descricao: (descricaoBase ? descricaoBase + ' ' : '') + `[${i+1}/${n}]`,
          parcela_grupo: grupoId,
          parcela_n: i + 1,
          parcela_total: n,
        });
      }
      statusMsg(`Parcelada em ${cabem}x!`);
    }
    saveState();
    e.target.reset();
    render();
  },
  salvarLancamentoReceita(e) {
    const f = new FormData(e.target);
    STATE.lancamentos_receitas.push({
      id: 'r_' + Date.now(),
      data: f.get('data'),
      pessoa: f.get('pessoa'),
      categoria: f.get('categoria'),
      valor: parseFloat(f.get('valor')),
      descricao: f.get('descricao') || '',
    });
    saveState();
    e.target.reset();
    statusMsg('Receita lançada!');
    render();
  },

  deleteLancamento(id) {
    if (!confirm('Apagar este lançamento?')) return;
    STATE.lancamentos = STATE.lancamentos.filter(l => l.id !== id);
    saveState(); render();
  },
  deleteLancamentoReceita(id) {
    if (!confirm('Apagar?')) return;
    STATE.lancamentos_receitas = STATE.lancamentos_receitas.filter(l => l.id !== id);
    saveState(); render();
  },

  setProjFiltro(campo, valor) {
    STATE.ui = STATE.ui || {};

    if (campo === 'de' && STATE.ui.proj_filtro_ate && valor > STATE.ui.proj_filtro_ate) {
      STATE.ui.proj_filtro_ate = valor;

    render();

  setHistFiltro(campo, valor) {

  limparHistFiltro(tipo) {

    render();

  editLanc(id, field, value) {
    const l = STATE.lancamentos.find(x => x.id === id);

    l[field] = field === 'valor' ? (parseFloat(value) || 0) : value;

  // ===== Modal de edição de despesa =====
  abrirModalEditarLanc(id) {

    STATE.ui.editing_lanc_id = id;
    render();
  },

    STATE.ui = STATE.ui || {};
    STATE.ui.editing_lanc_id = null;
    render();
  },
  toggleParcelasEdicao(form) {
    const checked = form.querySelector('[name="parcelar"]').checked;
    const row = document.getElementById('edit-parcelas-row');
    if (row) row.style.display = checked ? 'grid' : 'none';
    this.atualizarPreviewParcelasEdicao(form);

  atualizarPreviewParcelasEdicao(form) {

    const parcelarChk = form.querySelector('[name="parcelar"]');

    const mesBase = form.querySelector('[name="data"]')?.value;

    if (idxBase < 0) { preview.textContent = ''; return; }
    const meses = [];
    for (let i = 0; i < n && idxBase + i < SEMANAS_MES.length; i++) meses.push(SEMANAS_MES[idxBase + i].mes_nome);

    preview.textContent = `→ ${n}x de R$ ${parcelaValor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} (${meses.join(', ')})${aviso}`;
  },
  salvarEdicaoLanc(e) {
    e.preventDefault();
    const f = new FormData(e.target);
    const id = STATE.ui?.editing_lanc_id;
    if (!id) return;
    const lanc = STATE.lancamentos.find(x => x.id === id);

    const autor = f.get('autor');
    const categoria_id = f.get('categoria_id');
    const descricao = f.get('descricao') || '';
    const parcelar = f.get('parcelar') === 'on';
    const n = parcelar ? Math.max(2, Math.min(24, parseInt(f.get('parcelas')) || 2)) : 1;

    if (n === 1) {
      // Edição simples
      lanc.data = dataBase;
      lanc.autor = autor;
      lanc.categoria_id = categoria_id;
      lanc.valor = valor;
      lanc.descricao = descricao;

    } else {

      const idxBase = SEMANAS_MES.findIndex(m => m.chave_mes === dataBase);

      const cabem = Math.min(n, SEMANAS_MES.length - idxBase);

      STATE.lancamentos = STATE.lancamentos.filter(x => x.id !== id);
      const grupoId = 'pg_' + Date.now();
      const totalCent = Math.round(valor * 100);
      const baseCent = Math.floor(totalCent / cabem);
      const restoCent = totalCent - baseCent * cabem;
      for (let i = 0; i < cabem; i++) {
        const mes = SEMANAS_MES[idxBase + i].chave_mes;
        const vCent = (i === cabem - 1) ? baseCent + restoCent : baseCent;
        STATE.lancamentos.push({
          id: 'l_' + Date.now() + '_' + i,

          autor, categoria_id,

          parcela_total: n,

  abrirModalNovaDespesa() {
    // Cria um rascunho com defaults e abre o mesmo modal usado pra editar
    const novaDespesa = {
      id: 'nova_' + Date.now(),
      grupo: 'Variável',
      categoria: '',
      tipo: 'mensal',
      valor_base: 0,
      descricao: '',

      orcamento_anual: {},

      const inp = document.querySelector('.modal-body input[type="text"]');

  editPL(e) {
    const pessoa = e.target.dataset.pessoa;
    const grupo = e.target.dataset.grupo;
    const i = +e.target.dataset.idx;
    const field = e.target.dataset.field;
    const v = e.target.value;
    const key = pessoa === 'Felipe' ? 'pl_felipe' : 'pl_manu';
    STATE[key][grupo][i][field] = field === 'valor' ? parseNum(v) : v;
    if (field === 'valor') registrarSnapshotPL();
    saveState();

  // Atualização ao vivo dos totais e subtotais conforme o usuário digita
  recalcPL(pessoa) {
    const inputs = document.querySelectorAll(`input[data-pessoa="${pessoa}"][data-field="valor"]`);
    let ativosCurto = 0, ativosLongo = 0, passivosCurto = 0, passivosLongo = 0;
    inputs.forEach(inp => {
      const v = parseNum(inp.value);
      const grupo = inp.dataset.grupo;
      const prazo = inp.dataset.prazo || 'curto';
      if (grupo === 'ativos') {
        if (prazo === 'longo') ativosLongo += v; else ativosCurto += v;
      } else {
        if (prazo === 'longo') passivosLongo += v; else passivosCurto += v;
      }
    });
    const totAtivos = ativosCurto + ativosLongo;
    const totPassivos = passivosCurto + passivosLongo;
    const plTotal = totAtivos - totPassivos;
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = 'R$ ' + fmtMoney(val); };
    const setRaw = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = fmtMoney(val); };
    setRaw(`pl-${pessoa}-tot-ativos`, totAtivos);
    setRaw(`pl-${pessoa}-tot-passivos`, totPassivos);
    setRaw(`pl-${pessoa}-tot-pl`, plTotal);
    set(`pl-${pessoa}-ac-sub`, ativosCurto);
    set(`pl-${pessoa}-al-sub`, ativosLongo);
    set(`pl-${pessoa}-pc-sub`, passivosCurto);
    set(`pl-${pessoa}-pl-sub`, passivosLongo);
    // Atualiza cor do card PL Total (good/bad) se cruzar zero
    const card = document.getElementById(`pl-${pessoa}-tot-pl`)?.closest('.card');
    if (card) {
      card.classList.remove('good', 'bad');
      card.classList.add(plTotal >= 0 ? 'good' : 'bad');
    }
  },
  // ===== Drag & drop dos ativos/passivos =====
  _plDrag: null,
  plDragStart(e) {
    const tr = e.currentTarget;
    this._plDrag = {
      pessoa: tr.dataset.pessoa,
      grupo: tr.dataset.grupo,
      idx: parseInt(tr.dataset.idx, 10),
    };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'pl-row'); } catch (_) {}
    tr.classList.add('pl-dragging');
  },
  plDragOver(e) {
    if (!this._plDrag) return;
    const tr = e.currentTarget;
    // Só aceita drop dentro do mesmo grupo (ativos/passivos) e mesma pessoa
    if (tr.dataset.pessoa !== this._plDrag.pessoa || tr.dataset.grupo !== this._plDrag.grupo) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.pl-drop-before, .pl-drop-end').forEach(el => {
      if (el !== tr) { el.classList.remove('pl-drop-before'); el.classList.remove('pl-drop-end'); }
    });
    if (tr.dataset.end === '1' || tr.classList.contains('pl-empty-row')) tr.classList.add('pl-drop-end');
    else tr.classList.add('pl-drop-before');
  },
  plDragLeave(e) {
    const tr = e.currentTarget;
    // Só remove se realmente saiu (evita flicker quando entra em filho)
    if (!tr.contains(e.relatedTarget)) {
      tr.classList.remove('pl-drop-before');
      tr.classList.remove('pl-drop-end');
    }
  },
  plDrop(e) {
    e.preventDefault();
    if (!this._plDrag) return;
    const tr = e.currentTarget;
    const destPessoa = tr.dataset.pessoa;
    const destGrupo = tr.dataset.grupo;
    const destPrazo = tr.dataset.prazo;
    const isEnd = tr.dataset.end === '1' || tr.classList.contains('pl-empty-row');
    const {pessoa: srcPessoa, grupo: srcGrupo, idx: srcIdx} = this._plDrag;
    this.plDragEnd();
    if (srcPessoa !== destPessoa || srcGrupo !== destGrupo) { this._plDrag = null; return; }

    const key = srcPessoa === 'Felipe' ? 'pl_felipe' : 'pl_manu';
    const arr = STATE[key][srcGrupo];
    if (srcIdx < 0 || srcIdx >= arr.length) { this._plDrag = null; return; }

    let destIdx;
    if (isEnd) {
      // "Inserir ao final desse prazo": após o último item com este prazo
      let lastIdx = -1;
      for (let i = arr.length - 1; i >= 0; i--) {
        if ((arr[i].prazo || 'curto') === destPrazo) { lastIdx = i; break; }
      }
      destIdx = lastIdx + 1;
    } else {
      destIdx = parseInt(tr.dataset.idx, 10);
    }

    // No-op se cair no mesmo lugar
    if (srcIdx === destIdx || srcIdx === destIdx - 1) {
      // Mas se trocou de prazo, ainda assim aplica
      const item = arr[srcIdx];
      if (item.prazo !== destPrazo) {
        item.prazo = destPrazo;
        saveState(); render();
      }
      this._plDrag = null;
      return;
    }

    const [item] = arr.splice(srcIdx, 1);
    item.prazo = destPrazo;
    const adjustedDest = destIdx > srcIdx ? destIdx - 1 : destIdx;
    arr.splice(adjustedDest, 0, item);
    this._plDrag = null;
    saveState(); render();
  },
  plDragEnd() {
    document.querySelectorAll('.pl-dragging').forEach(el => el.classList.remove('pl-dragging'));
    document.querySelectorAll('.pl-drop-before, .pl-drop-end').forEach(el => {
      el.classList.remove('pl-drop-before');
      el.classList.remove('pl-drop-end');
    });
  },
  addPLLinha(pessoa, grupo, prazo) {
    const key = pessoa === 'Felipe' ? 'pl_felipe' : 'pl_manu';
    const p = prazo === 'longo' ? 'longo' : 'curto';
    if (grupo === 'ativos') STATE[key].ativos.push({item:'Novo', tipo:'caixa', valor:0, prazo:p});
    else STATE[key].passivos.push({item:'Novo', valor:0, prazo:p});
    registrarSnapshotPL();
    saveState(); render();
  },
  deletePLLinha(pessoa, grupo, i) {
    if (!confirm('Apagar?')) return;
    const key = pessoa === 'Felipe' ? 'pl_felipe' : 'pl_manu';
    STATE[key][grupo].splice(i,1);
    registrarSnapshotPL();
    saveState(); render();
  },

  fecharMes() {
    const ma = STATE.config.mes_ativo;
    // Bloqueia fechar fora de ordem: meses anteriores precisam estar fechados
    const anterioresNaoFechados = SEMANAS_MES
      .filter(m => m.chave_mes < ma)
      .filter(m => !STATE.historico.find(h => h.chave_mes === m.chave_mes));
    if (anterioresNaoFechados.length > 0) {
      alert(`Não dá pra fechar ${ma}. Ainda faltam: ${anterioresNaoFechados.map(m => m.mes_nome).join(', ')}`);
      return;
    }
    if (STATE.historico.find(h => h.chave_mes === ma)) {
      if (!confirm('Mês ' + ma + ' já foi fechado. Refechar?')) return;
      STATE.historico = STATE.historico.filter(h => h.chave_mes !== ma);
    }
    const recO = orcadoTotalReceitasMes(ma);
    const recR = realizadoTotalReceitasMes(ma);
    const despO = orcadoTotalDespesasMes(ma);
    const despR = realizadoTotalDespesasMes(ma);
    const plFim = plCasal();
    // PL_ini = pl_fim do mês cronologicamente anterior (não o último do array)
    const anterior = STATE.historico
      .filter(h => h.chave_mes < ma)
      .sort((a,b) => b.chave_mes.localeCompare(a.chave_mes))[0];
    const plIni = anterior?.pl_fim ?? plFim;
    const resOrc = recO - despO;
    const resReal = recR - despR;
    STATE.historico.push({
      chave_mes: ma,
      pl_ini: plIni,
      rec_orc: recO, rec_real: recR,
      desp_orc: despO, desp_real: despR,
      res_orc: resOrc, res_real: resReal,
      pl_fim: plFim,
      variacao: resReal - resOrc,
    });
    // Avança o mês ativo pro próximo
    const i = SEMANAS_MES.findIndex(m => m.chave_mes === ma);
    if (i >= 0 && i < SEMANAS_MES.length - 1) {
      STATE.config.mes_ativo = SEMANAS_MES[i+1].chave_mes;
    }
    saveState();
    statusMsg('Mês ' + ma + ' fechado!');
    render();
  },

  resetarTudo() {
    if (!confirm('ATENÇÃO: apaga lançamentos, PL e volta o orçamento ao padrão. Continuar?')) return;
    STATE = defaultState();
    saveState();
    render();
  },

  cancelarNovaDespesa(id) {
    // Remove o rascunho criado e fecha
    STATE.budget_despesas = STATE.budget_despesas.filter(d => d.id !== id);
    saveState();
    this.fecharModal();
    render();
  },
  confirmarNovaDespesa(id) {
    const d = STATE.budget_despesas.find(x => x.id === id);
    if (!d) { this.fecharModal(); return; }
    if (!d.categoria || !d.categoria.trim()) {
      alert('Digite um nome para a categoria.');
      return;
    }
    saveState();
    this.fecharModal();
    statusMsg(`Categoria "${d.categoria}" criada em ${d.grupo}`);
    render();
  },
  modalEditDespesa(id, field, value) {
    const d = STATE.budget_despesas.find(x => x.id === id);
    if (!d) return;
    if (field === 'orc_2026' || field === 'orc_2027') {
      d.orcamento_anual = d.orcamento_anual || {};
      const ano = field === 'orc_2026' ? 2026 : 2027;
      if (value === '' || value === null) delete d.orcamento_anual[ano];
      else d.orcamento_anual[ano] = parseFloat(value);
    } else if (field === 'valor_base') {
      const valorAntigo = Number(d.valor_base) || 0;
      const novoValor = parseFloat(value) || 0;
      d.valor_base = novoValor;
      // Se anual_acrual, preserva a frequência e recalcula orcamento_anual
      if (d.tipo === 'anual_acrual' && valorAntigo > 0 && d.orcamento_anual) {
        const meses2026 = mesesAno(2026).length;
        const meses2027 = mesesAno(2027).length;
        const freq = (d.orcamento_anual[2027] || 0) / valorAntigo;
        d.orcamento_anual[2027] = novoValor * freq;
        d.orcamento_anual[2026] = novoValor * freq * (meses2026 / 12);
      }
      saveState();
      this.renderModalDespesa(d);
      return;
    } else if (field === 'freq_anual') {
      const freq = parseFloat(value) || 0;
      const vb = Number(d.valor_base) || 0;
      d.orcamento_anual = d.orcamento_anual || {};
      const meses2026 = mesesAno(2026).length;
      const meses2027 = mesesAno(2027).length;
      d.orcamento_anual[2027] = vb * freq * (meses2027 / 12);
      d.orcamento_anual[2026] = vb * freq * (meses2026 / 12);
      saveState();
      this.renderModalDespesa(d);
      return;
    } else if (field === 'tipo') {
      d.tipo = value;
      // Se mudou pra data_fixa e não tem ocorrencias, cria array
      if (value === 'data_fixa' && !d.ocorrencias) d.ocorrencias = [];
      // Rerenderiza o modal pra mostrar campos relevantes
      saveState();
      this.renderModalDespesa(d);
      return;
    } else {
      d[field] = value;
    }
    saveState();
  },
  modalEditOcorrencia(id, chave_mes, value) {
    const d = STATE.budget_despesas.find(x => x.id === id);
    if (!d) return;
    d.ocorrencias = d.ocorrencias || [];
    const v = value === '' ? null : parseFloat(value);
    const existing = d.ocorrencias.find(o => o.chave_mes === chave_mes);
    if (v === null || isNaN(v) || v === 0) {
      // Remove ocorrência
      d.ocorrencias = d.ocorrencias.filter(o => o.chave_mes !== chave_mes);
    } else if (existing) {
      existing.valor = v;
    } else {
      d.ocorrencias.push({chave_mes, valor: v});
    }
    saveState();
  },
  deleteDespesaByID(id) {
    if (!confirm('Apagar esta categoria? Todos os lançamentos vinculados ficarão órfãos.')) return;
    STATE.budget_despesas = STATE.budget_despesas.filter(d => d.id !== id);
    saveState();
    this.fecharModal();
    render();
  },

    this.fecharModal();
    render();
  },
};
window.app = app;

// ==========================================================
// 7. INIT
// ==========================================================

// Tooltip global pros chips — posiciona via JS pra escapar do overflow do modal
document.addEventListener('mouseover', (e) => {
  const chip = e.target.closest('.chip-tipo');
  if (!chip) return;
  const tooltip = chip.querySelector('.chip-tooltip');
  if (!tooltip) return;
  tooltip.style.display = 'block';
  tooltip.style.visibility = 'hidden';
  requestAnimationFrame(() => {
    const rect = chip.getBoundingClientRect();
    const ttH = tooltip.offsetHeight;
    const ttW = tooltip.offsetWidth;
    let top = rect.top - ttH - 10;
    if (top < 10) top = rect.bottom + 10;
    let left = rect.left + rect.width/2 - ttW/2;
    if (left < 10) left = 10;
    if (left + ttW > window.innerWidth - 10) left = window.innerWidth - ttW - 10;
    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
    tooltip.style.visibility = 'visible';
  });
});
document.addEventListener('mouseout', (e) => {
  const chip = e.target.closest('.chip-tipo');
  if (!chip) return;
  const tooltip = chip.querySelector('.chip-tooltip');
  if (tooltip) tooltip.style.display = 'none';
});

// Init: renderiza e tenta baixar da nuvem se configurado
render();
if (STATE.config?.sync_url) {
  syncDownload(true).then(baixou => { if (baixou) render(); });
} else {
  setSyncStatus('off');
}
</script>
